<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIVINE JOHAN</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg: #0a0a0a;
        --bg-card: #111111;
        --bg-elevated: #161616;
        --text: #ffffff;
        --text-muted: #888888;
        --text-dim: #555555;
        --border: #222222;
      }
      body {
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow-x: hidden;
        min-height: 100vh;
        -webkit-tap-highlight-color: transparent;
      }
      .bg-mesh {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse 80% 50% at 20% 40%, rgba(255, 255, 255, 0.03) 0%, transparent 50%),
          radial-gradient(ellipse 60% 40% at 80% 60%, rgba(255, 255, 255, 0.02) 0%, transparent 50%);
      }
      .bg-lines {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
        opacity: 0.15;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 60px 60px;
      }
      .noise {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
        opacity: 0.025;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }
      .cursor-glow {
        position: fixed;
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, transparent 70%);
        border-radius: 50%;
        pointer-events: none;
        z-index: 0;
        transform: translate(-50%, -50%);
      }
      .container {
        position: relative;
        z-index: 2;
        max-width: 900px;
        margin: 0 auto;
        padding: 0 24px;
      }

      /* ===== TOUCH RIPPLE ===== */
      .ripple {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        transform: scale(0);
        animation: ripple-anim 0.6s ease-out forwards;
        pointer-events: none;
        z-index: 10;
      }
      @keyframes ripple-anim {
        to {
          transform: scale(4);
          opacity: 0;
        }
      }

      /* Hero */
      .hero {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
      }
      .views-counter {
        position: absolute;
        top: 80px;
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        letter-spacing: 3px;
        color: var(--text-dim);
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .views-counter::before {
        content: "";
        width: 6px;
        height: 6px;
        background: var(--text-dim);
        border-radius: 50%;
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.3;
        }
        50% {
          opacity: 1;
        }
      }
      .hero-title {
        font-size: clamp(2.5rem, 8vw, 5rem);
        font-weight: 800;
        letter-spacing: -2px;
        margin-bottom: 24px;
        line-height: 1.1;
      }
      .hero-title .highlight {
        background: linear-gradient(135deg, #fff 0%, #888 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .role-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
        min-height: 60px;
      }
      .role-prefix {
        font-family: "JetBrains Mono", monospace;
        font-size: clamp(1rem, 3vw, 1.5rem);
        color: var(--text-muted);
        font-weight: 400;
      }
      .role-box {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 28px;
        min-width: 280px;
        position: relative;
        overflow: hidden;
      }
      .role-box::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
        animation: shimmer 3s infinite;
      }
      @keyframes shimmer {
        0% {
          left: -100%;
        }
        100% {
          left: 100%;
        }
      }
      .role-text {
        font-family: "JetBrains Mono", monospace;
        font-size: clamp(1rem, 3vw, 1.4rem);
        font-weight: 600;
        color: var(--text);
        display: inline-block;
        min-width: 200px;
      }
      .role-subtext {
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        color: var(--text-dim);
        margin-top: 12px;
        letter-spacing: 2px;
        text-transform: uppercase;
        opacity: 0;
        transform: translateY(10px);
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .role-subtext.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .scroll-indicator {
        position: absolute;
        bottom: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        animation: bounce 2s infinite;
      }
      .scroll-indicator span {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        letter-spacing: 4px;
        color: var(--text-dim);
        text-transform: uppercase;
      }
      .scroll-indicator svg {
        width: 20px;
        height: 20px;
        color: var(--text-dim);
      }
      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(10px);
        }
      }

      /* Discord */
      .discord-section {
        padding: 100px 0;
      }
      .section-label {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        letter-spacing: 4px;
        color: var(--text-dim);
        text-transform: uppercase;
        margin-bottom: 40px;
        text-align: center;
      }
      .discord-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 32px;
        display: flex;
        align-items: center;
        gap: 24px;
        position: relative;
        overflow: hidden;
        transition:
          transform 0.3s ease,
          border-color 0.3s ease;
      }
      .discord-card:hover {
        transform: translateY(-4px);
        border-color: #333;
      }
      .discord-card::after {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        width: 150px;
        height: 150px;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, transparent 70%);
        pointer-events: none;
      }
      .avatar-wrapper {
        position: relative;
        flex-shrink: 0;
      }
      .avatar {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--border);
      }
      .status-dot {
        position: absolute;
        bottom: 4px;
        right: 4px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #747f8d;
        border: 3px solid var(--bg-card);
      }
      .discord-info {
        flex: 1;
      }
      .discord-name {
        font-size: 1.3rem;
        font-weight: 700;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .discord-username {
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        color: var(--text-muted);
      }
      .discord-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 8px;
      }

      /* About */
      .about-section {
        padding: 100px 0;
      }
      .about-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 40px;
      }
      .about-text {
        font-size: 1.1rem;
        line-height: 1.8;
        color: var(--text-muted);
        max-width: 600px;
      }
      .about-text p {
        margin-bottom: 16px;
      }
      .about-text .accent-word {
        color: var(--text);
        font-weight: 600;
      }

      /* Skills */
      .skills-section {
        padding: 60px 0;
      }
      .skills-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
      }
      .skill-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        transition: all 0.3s ease;
        cursor: default;
      }
      .skill-card:hover {
        border-color: #333;
        transform: translateY(-2px);
      }
      .skill-title {
        font-size: 0.95rem;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .skill-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .skill-tag {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 3px 8px;
        color: var(--text-muted);
      }

      /* GitHub Link */
      .links-section {
        padding: 60px 0 140px;
      }
      .links-grid {
        display: grid;
        gap: 16px;
      }
      .link-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 28px 32px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        position: relative;
        overflow: hidden;
        transition: all 0.3s ease;
        cursor: pointer;
        text-decoration: none;
        color: inherit;
      }
      .link-card:hover {
        transform: translateY(-3px);
        border-color: #333;
      }
      .link-card::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, transparent, #fff, transparent);
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .link-card:hover::after {
        opacity: 0.6;
      }
      .link-card::before {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 60px;
        background: linear-gradient(to top, rgba(255, 255, 255, 0.04), transparent);
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .link-card:hover::before {
        opacity: 1;
      }
      .link-name {
        font-size: 1.2rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .link-name .arrow {
        font-family: "JetBrains Mono", monospace;
        color: var(--text-muted);
      }
      .link-url {
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        color: var(--text-muted);
      }

      /* ===== MUSIC PLAYER (screenshot style) ===== */
      .music-player {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(17, 17, 17, 0.95);
        backdrop-filter: blur(20px);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
        z-index: 100;
        max-width: 420px;
        width: calc(100% - 48px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }
      .music-left {
        display: flex;
        align-items: center;
        gap: 14px;
        flex: 1;
        min-width: 0;
      }
      .music-cover {
        width: 52px;
        height: 52px;
        border-radius: 10px;
        background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .music-cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .music-cover svg {
        color: var(--text-dim);
      }
      .music-main {
        flex: 1;
        min-width: 0;
      }
      .music-track {
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--text);
      }
      .music-artist {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 2px;
      }
      .music-progress-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
      }
      .music-time {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--text-dim);
        min-width: 32px;
      }
      .progress-bar {
        flex: 1;
        height: 4px;
        background: var(--bg-elevated);
        border-radius: 2px;
        overflow: hidden;
        cursor: pointer;
        position: relative;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        background: var(--text);
        border-radius: 2px;
        transition: width 0.1s linear;
      }
      .music-controls-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 10px;
      }
      .music-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.2s;
      }
      .music-btn:hover {
        color: var(--text);
      }
      .music-btn svg {
        display: block;
      }

      .music-right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        margin-left: 8px;
      }
      .music-top-icons {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .music-top-btn {
        background: none;
        border: none;
        color: var(--text-dim);
        cursor: pointer;
        padding: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.2s;
      }
      .music-top-btn:hover {
        color: var(--text);
      }
      .volume-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 80px;
        height: 4px;
        background: var(--bg-elevated);
        border-radius: 2px;
        outline: none;
        cursor: pointer;
      }
      .volume-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 14px;
        height: 14px;
        background: var(--text);
        border-radius: 50%;
        cursor: pointer;
      }
      .volume-slider::-moz-range-thumb {
        width: 14px;
        height: 14px;
        background: var(--text);
        border-radius: 50%;
        cursor: pointer;
        border: none;
      }

      .fade-in {
        opacity: 0;
        transform: translateY(30px);
        transition:
          opacity 0.8s ease,
          transform 0.8s ease;
      }
      .fade-in.visible {
        opacity: 1;
        transform: translateY(0);
      }

      @media (max-width: 640px) {
        .discord-card {
          flex-direction: column;
          text-align: center;
        }
        .role-box {
          min-width: 240px;
          padding: 10px 20px;
        }
        .about-card {
          padding: 24px;
        }
        .music-player {
          padding: 12px 14px;
          gap: 10px;
        }
        .music-right {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-mesh"></div>
    <div class="bg-lines"></div>
    <div class="noise"></div>
    <div class="cursor-glow" id="cursorGlow"></div>

    <div class="container">
      <!-- Hero -->
      <section class="hero">
        <div class="views-counter">
          <span id="viewCount">585</span>
          views
        </div>
        <h1 class="hero-title">
          hi, im
          <span class="highlight">DIVINE JOHAN</span>
        </h1>
        <div class="role-container">
          <span class="role-prefix">i am</span>
          <div class="role-box" id="roleBox"><span class="role-text" id="roleText"></span></div>
        </div>
        <div class="role-subtext" id="roleSubtext"></div>

        <div class="scroll-indicator">
          <span>scroll down</span>
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="20" height="20">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
          </svg>
        </div>
      </section>

      <!-- Discord -->
      <section class="discord-section fade-in" id="discordSection">
        <div class="section-label">Discord Presence</div>
        <div class="discord-card" id="discordCard">
          <div class="avatar-wrapper">
            <img
              src="https://cdn.discordapp.com/avatars/1378350961285795870/6117d715761635a9857b698ec4fabadb.png?size=256"
              alt="avatar"
              class="avatar"
              id="discordAvatar"
            />
            <div class="status-dot" id="statusDot" style="background: #747f8d"></div>
          </div>
          <div class="discord-info">
            <div class="discord-name" id="discordDisplayName">┍DIVINE JOHAN ヨハン┙</div>
            <div class="discord-username" id="discordUsername">@johan_x_silent</div>
            <div style="margin-top: 10px">
              <span class="discord-badge" id="statusBadge">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                  <circle cx="12" cy="12" r="10"></circle>
                </svg>
                offline
              </span>
            </div>
          </div>
        </div>
      </section>

      <!-- About -->
      <section class="about-section fade-in" id="aboutSection">
        <div class="section-label">About</div>
        <div class="about-card" id="aboutCard">
          <div class="about-text">
            <p>
              I started coding at
              <span class="accent-word">13</span>
              , diving deep into the world of programming and never looking back.
            </p>
            <p>
              I'm an
              <sp
